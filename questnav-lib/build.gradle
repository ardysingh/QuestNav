import edu.wpi.first.toolchain.*

plugins {
    id 'cpp'
    id 'java'
    id 'google-test'
    id 'edu.wpi.first.wpilib.repositories.WPILibRepositoriesPlugin' version '2025.0'
    id 'edu.wpi.first.NativeUtils' version '2025.9.0'
    id 'edu.wpi.first.GradleJni' version '1.1.0'
    id 'edu.wpi.first.GradleVsCode' version '2.1.0'
    id "edu.wpi.first.GradleRIO" version "2025.3.2"
    // wpiutil-cpp-2025.3.2-headeres
}

// WPILib Version
ext.wpilibVersion = "2025.+"

repositories {
    mavenCentral()
}
if (project.hasProperty('releaseMode')) {
    wpilibRepositories.addAllReleaseRepositories(project)
} else {
    wpilibRepositories.addAllDevelopmentRepositories(project)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
var javaVersion = "17"

// Apply C++ configuration
apply from: 'config.gradle'

// Apply Java configuration
dependencies {
    implementation "edu.wpi.first.cscore:cscore-java:$wpilibVersion"
    implementation "edu.wpi.first.cameraserver:cameraserver-java:$wpilibVersion"
    implementation "edu.wpi.first.ntcore:ntcore-java:$wpilibVersion"
    implementation "edu.wpi.first.wpilibj:wpilibj-java:$wpilibVersion"
    implementation "edu.wpi.first.wpiutil:wpiutil-java:$wpilibVersion"
    implementation "edu.wpi.first.wpimath:wpimath-java:$wpilibVersion"
    implementation "edu.wpi.first.wpiunits:wpiunits-java:$wpilibVersion"
    implementation "edu.wpi.first.hal:hal-java:$wpilibVersion"
    implementation "us.hebi.quickbuf:quickbuf-runtime:1.4"
    implementation "org.ejml:ejml-simple:0.43.1"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.15.2"
    implementation "com.fasterxml.jackson.core:jackson-core:2.15.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.15.2"
    implementation 'edu.wpi.first.thirdparty.frc2025.opencv:opencv-java:4.10.0-2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Set up java tests
test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

if (project.hasProperty('onlylinuxathena') || project.hasProperty('onlylinuxarm32') || project.hasProperty('onlylinuxarm64') || project.hasProperty('onlywindowsarm64') || project.hasProperty('onlylinuxsystemcore')) {
    test.enabled = false
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
}

// Setup Javadocs to link back to WPILib docs
javadoc {
    options {
        links "https://docs.oracle.com/en/java/javase/$javaVersion/docs/api/", 'https://github.wpilib.org/allwpilib/docs/release/java/'
        exclude '**/generated/**'
    }
}

// Set up exports properly
nativeUtils {
    exportsConfigs {
        // Main library is just default empty. This will export everything
        QuestNavLib {
        }
    }
}

ext.getCurrentArch = {
    return NativePlatforms.desktop
}

def systemArch = getCurrentArch()

model {
    components {
        QuestNavLib(NativeLibrarySpec) {
            sources {
                cpp {
                    source {
                        srcDirs 'src/main/native/cpp'
                        include '**/*.cpp'
                    }
                    exportedHeaders {
                        // srcDirs '/Users/ardaman/wpilib-includes'
                        srcDirs 'src/main/native/include'
                        srcDirs 'src/main/native/cpp/gg/questnav/questnav/protos/generated'
                        srcDirs '/opt/homebrew/opt/nanopb/include' // Add Protobuf include path
                        srcDirs '/Users/ardaman/.gradle/caches/8.11/transforms/b21a2f217fa42f4cd1ca6ab0cb3be68d/transformed/wpiutil-cpp-2025.3.2-headers'
                        srcDirs '/Users/ardaman/.gradle/caches/8.11/transforms/88c076aa0a3979c2e0dc5686a74190c9/transformed/ntcore-cpp-2025.3.2-headers'
                        srcDirs '/Users/ardaman/.gradle/caches/8.11/transforms/80049d069e6ee642065ee88c00b7c235/transformed/wpimath-cpp-2025.3.2-headers'
                        srcDirs '/Users/ardaman/.gradle/caches/8.11/transforms/02584e30fe6ef13ba857457f0bf5d38c/transformed/wpilibc-cpp-2025.3.2-headers'
                        
                    }
                }
            }
            binaries.all {
                cppCompiler.args.add('-I/opt/homebrew/opt/nanopb/include') // Include Protobuf headers
                linker.args.add('-L/opt/homebrew/opt/nanopb/lib')            // Link Protobuf libraries
            }
            nativeUtils.useRequiredLibrary(it, 'wpilib_shared')
            
            wpi.cpp.enableExternalTasks(it)
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)

        }
    }
    // testSuites {
    //     QuestNavLibTest {
    //         sources.cpp {
    //             source {
    //                 srcDir 'src/test/native/cpp'
    //                 include '**/*.cpp'
    //             }
    //         }

    //         nativeUtils.useRequiredLibrary(it, "wpilib_executable_shared", "googletest_static")
    //     }
    // }
}

apply from: 'publish.gradle'

wrapper {
    gradleVersion '8.11'
}
